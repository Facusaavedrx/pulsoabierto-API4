# Configuración de despliegue en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: cualquier ruta (por ejemplo /cripto/bitcoin) devuelve index.html
# para que React Router resuelva la vista al abrir o recargar la página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
